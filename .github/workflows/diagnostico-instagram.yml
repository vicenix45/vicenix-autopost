name: Diagnostico Instagram

on:
  workflow_dispatch: {}

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Testar chamadas (nao publica nada)
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python diagnostico_instagram.py
