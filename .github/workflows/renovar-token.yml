name: Renovar token do Instagram

# O token do Instagram vence em 60 dias. Toda segunda ele e renovado e o segredo IG_TOKEN e trocado.
on:
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch: {}

jobs:
  renovar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Renovar
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: python renovar_token.py
