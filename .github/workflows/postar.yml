name: Postar videos

on:
  schedule:
    # a cada 30 min, das 9h as 23h30 (horario de Brasilia = UTC-3)
    - cron: "3,33 12-23,0-2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: postar
  cancel-in-progress: false

jobs:
  postar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Publicar o que chegou no horario
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python postar.py

      - name: Salvar a fila atualizada
        if: always()
        run: |
          git config user.name "robo-postagem"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fila.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fila: postagens de $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')"
          git pull --rebase
          git push
